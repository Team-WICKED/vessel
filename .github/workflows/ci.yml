name: CI

# [Decision Log] (2026-11-06)
# - Purpose: check the gate (AGENTS.md section 1) on Linux, Windows and macOS.
# - Constraint: the repository is private, so hosted minutes count against
#   the organisation's 2,000 a month, at 1x for Linux, 2x for Windows and 10x
#   for macOS. Running all three on every push to `backend/**` (milestones
#   1-3) used the whole month's minutes in two days (Linux 215, Windows 408,
#   macOS 107 minutes).
# - Alternatives: keep push triggers but Linux only (still a hosted run per
#   push, and agents push often); a self-hosted Linux runner on ingwdev1
#   (free, needs a dedicated unprivileged user; pending the operator's go);
#   no CI (Windows and macOS regressions only found at release).
# - Choice: nothing runs on push. Pull requests to `main` run Linux. Windows
#   and macOS run only when started by hand (`gh workflow run CI -r <branch>
#   -f platforms=all`), at milestone merges. Agents run the gate locally,
#   plus the cross-target clippy where it works.
# - Trade-off: a Windows- or macOS-only break is found at the milestone
#   merge instead of on the track branch.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to run"
        type: choice
        options: [linux, linux-windows, all]
        default: linux
  pull_request:
    branches: [main]

# A newer run on the same ref replaces an older one instead of queueing
# behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One line: the expression parser is not documented to accept the
        # line breaks a folded block keeps for more-indented lines.
        os: ${{ fromJSON(inputs.platforms == 'all' && '["ubuntu-latest","windows-latest","macos-latest"]' || inputs.platforms == 'linux-windows' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The fake harnesses, under vessel-testkit's own feature set: the first
      # build of that set compiles about 30 crates, and doing it here keeps
      # it out of the test timings (see vessel_testkit::within).
      - run: cargo build -p vessel-testkit --bins
      # The node binary for tests outside vessel-node (vessel_testkit::vesseld),
      # under vessel-node's own feature set, for the same reason.
      - run: cargo build -p vessel-node --bin vesseld
      # Every test binary runs even after one fails, so a single failure
      # does not hide the state of the rest (on Windows it hid all of it).
      - run: cargo test --workspace --no-fail-fast
