name: CI

# [Decision Log] (2026-11-06)
# - Purpose: check the gate (AGENTS.md section 1) on Linux, Windows and macOS.
# - History: while the repository was private, hosted minutes counted against
#   the organisation's 2,000 a month (Windows 2x, macOS 10x), and three OSes
#   on every push used the month in two days. Runs were then manual only.
# - Now: the repository is public, and standard GitHub-hosted runners are
#   free for public repositories, so every push to `main` and `backend/**`
#   (track branches get Windows and macOS results without a pull request;
#   agents cannot run those platforms locally) and every pull request runs
#   all three again. A run can also be started by hand.
# - Guard rails kept from the private period: a newer run on the same ref
#   cancels the older one, and each job times out at 45 minutes. If the
#   repository ever goes private again, return to manual runs first.
on:
  push:
    branches: [main, "backend/**"]
  pull_request:
  workflow_dispatch:

# A newer run on the same ref replaces an older one instead of queueing
# behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The web UI's TypeScript declarations (ADR 0017): the `ts` features of
      # vessel-proto (the wire) and vessel-web (the bridge's frames), linted,
      # and their tests failing while web/src/wire differs from what the
      # Rust types declare. The files are the same on every OS.
      - if: runner.os == 'Linux'
        run: cargo clippy -p vessel-proto -p vessel-web --features ts --all-targets -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo test -p vessel-proto -p vessel-web --features ts --lib typescript
      # The fake harnesses, under vessel-testkit's own feature set: the first
      # build of that set compiles about 30 crates, and doing it here keeps
      # it out of the test timings (see vessel_testkit::within).
      - run: cargo build -p vessel-testkit --bins
      # The node binary for tests outside vessel-node (vessel_testkit::vesseld),
      # under vessel-node's own feature set, for the same reason.
      - run: cargo build -p vessel-node --bin vesseld
      # Every test binary runs even after one fails, so a single failure
      # does not hide the state of the rest (on Windows it hid all of it).
      - run: cargo test --workspace --no-fail-fast

  # The web UI (ADR 0017), on Linux: the page's own checks, then the
  # `vessel` binary with the page embedded (a missing bundle fails the
  # build here, as in a release), then the page end to end against real
  # nodes with the fake harnesses, and the screenshots of every main
  # screen, kept as an artifact for review.
  web:
    name: web UI (lint / test / build / e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: web
      # ESLint (no `any`, no raw HTML), Prettier, the font rule.
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      # The font rule over the built CSS too (third-party stylesheets).
      - run: npm run fonts
        working-directory: web
      - run: cargo build -p vessel-cli
        env:
          VESSEL_WEB_REQUIRE_BUNDLE: "1"
      - run: cargo build -p vessel-node --bin vesseld
      - run: cargo build -p vessel-testkit --bins
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - run: npm run screens
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-ui-screens
          path: |
            web/artifacts/screens
          if-no-files-found: ignore
