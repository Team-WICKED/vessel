name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The fake harnesses, under vessel-testkit's own feature set: the first
      # build of that set compiles about 30 crates, and doing it here keeps
      # it out of the test timings (see vessel_testkit::within).
      - run: cargo build -p vessel-testkit --bins
      # Every test binary runs even after one fails, so a single failure
      # does not hide the state of the rest (on Windows it hid all of it).
      - run: cargo test --workspace --no-fail-fast
