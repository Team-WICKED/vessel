[workspace]
resolver = "3"
members = ["crates/*"]
# Parked until ported to the protocol-2 contract (docs/plans/backend-m1.md, spine track).
exclude = ["crates/vessel-node", "crates/vessel-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "UNLICENSED"
repository = "https://github.com/Team-WICKED/vessel"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_import_braces = "warn"
unused_results = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

# Panics and escape hatches: denied outright.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
exit = "deny"
mem_forget = "deny"
dbg_macro = "deny"

# Lossy or surprising arithmetic and conversions
as_conversions = "deny"
arithmetic_side_effects = "deny"
integer_division = "deny"
float_arithmetic = "deny"
float_cmp = "deny"
lossy_float_literal = "deny"
cast_lossless = "deny"

# Suppressions must be explicit and justified
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Output goes through `tracing` (the CLI writes to a locked stdout handle instead)
print_stdout = "deny"
print_stderr = "deny"

map_err_ignore = "warn"
let_underscore_must_use = "warn"
error_impl_error = "warn"
result_large_err = "warn"
clone_on_ref_ptr = "warn"
same_name_method = "warn"
str_to_string = "warn"
wildcard_enum_match_arm = "warn"

[workspace.dependencies]
vessel-proto = { path = "crates/vessel-proto" }
vessel-node = { path = "crates/vessel-node" }

axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures-util = "0.3"
hostname = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "process", "io-util", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
which = "7"
