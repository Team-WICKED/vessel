[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-file = "LICENSE.md"
repository = "https://github.com/Team-WICKED/vessel"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_import_braces = "warn"
unused_results = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

# Panics and escape hatches: denied outright.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
exit = "deny"
mem_forget = "deny"
dbg_macro = "deny"

# Lossy or surprising arithmetic and conversions
as_conversions = "deny"
arithmetic_side_effects = "deny"
integer_division = "deny"
float_arithmetic = "deny"
float_cmp = "deny"
lossy_float_literal = "deny"
cast_lossless = "deny"

# Suppressions must be explicit and justified
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Output goes through `tracing` (the CLI writes to a locked stdout handle instead)
print_stdout = "deny"
print_stderr = "deny"

map_err_ignore = "warn"
let_underscore_must_use = "warn"
error_impl_error = "warn"
result_large_err = "warn"
clone_on_ref_ptr = "warn"
same_name_method = "warn"
str_to_string = "warn"
wildcard_enum_match_arm = "warn"

[workspace.dependencies]
vessel-agent = { path = "crates/vessel-agent" }
vessel-client = { path = "crates/vessel-client" }
vessel-fleet = { path = "crates/vessel-fleet" }
vessel-harness = { path = "crates/vessel-harness" }
vessel-llm = { path = "crates/vessel-llm" }
vessel-lsp = { path = "crates/vessel-lsp" }
vessel-mcp = { path = "crates/vessel-mcp" }
vessel-node = { path = "crates/vessel-node" }
vessel-proc = { path = "crates/vessel-proc" }
vessel-proto = { path = "crates/vessel-proto" }
vessel-pty = { path = "crates/vessel-pty" }
vessel-relay = { path = "crates/vessel-relay" }
vessel-remote = { path = "crates/vessel-remote" }
vessel-rpc = { path = "crates/vessel-rpc" }
vessel-secure = { path = "crates/vessel-secure" }
vessel-session = { path = "crates/vessel-session" }
vessel-store = { path = "crates/vessel-store" }
vessel-testkit = { path = "crates/vessel-testkit" }
vessel-web = { path = "crates/vessel-web" }

# The Agent Client Protocol SDK (Zed's); one pinned version, used only by
# vessel-agent (and the fake agent in vessel-testkit). ADR 0003.
agent-client-protocol = "5.0"
axum = { version = "0.8", features = ["ws"] }
# The relay's own accept loop (vessel-relay `server::accept`): HTTP/1 with
# a header-read timeout and per-address counts from `accept`, which
# `axum::serve` cannot give (the security review, round 7). All three are
# already in the tree through axum, at these versions.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
# Raw mode and window size for `vessel attach` on Unix and Windows; no event
# loop (input is read as raw bytes), hence no default features (vessel-cli).
crossterm = { version = "0.29", default-features = false, features = ["windows"] }
# X25519 base-point multiplication: a node's public key from its stored
# secret (vessel-secure). Already in the tree through `snow`, which uses the
# same function, so deriving the key cannot fail and adds no crate.
curve25519-dalek = { version = "4.1.3", default-features = false }
dirs = "6"
futures-util = "0.3"
# OS randomness for the 256-bit node token (vessel-store, ADR 0005), test
# and relay keys (vessel-secure), and device credentials and pairing
# invitations (vessel-node, ADR 0010).
getrandom = "0.4"
hostname = "0.4"
# Unix process groups and signals (killpg) without `unsafe` (vessel-proc);
# waiting for a PTY program without reaping it, `waitid` (vessel-pty).
nix = { version = "0.31", features = ["signal"] }
# PTYs on Unix and Windows ConPTY behind one API (vessel-pty).
portable-pty = "0.9"
# Windows job objects for vessel-proc (Windows only): the child starts
# suspended, joins a kill-on-close job, then resumes, so the whole tree
# (`.cmd` shim, node, the harness, its MCP servers) stops together. Keeps
# the Win32 FFI and its `unsafe` out of this workspace.
process-wrap = { version = "10", default-features = false, features = ["job-object", "kill-on-drop", "tokio1"] }
# Pairing links as QR codes in the terminal (`vessel node pair`, M3 plan
# decision 2). Default features off: the unicode renderer only, with no
# dependencies and no `unsafe` (checked 2026-11-06).
qrcode = { version = "0.14", default-features = false }
# The MCP server of `vessel mcp` (vessel-mcp, ADR 0013; plan decision 8).
# Checked 2026-11-06 against AGENTS.md section 9: no `unsafe` of ours (its
# one block is in its own tests), the same tokio runtime, and only `server`
# and `transport-io`: no macros, HTTP, auth or child processes. It adds
# schemars and five small helpers to the tree.
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io"] }
# SQLite event log with the library compiled in (vessel-store, ADR 0004).
rusqlite = { version = "0.41", features = ["bundled"] }
# Whether two paths are one file (vessel-harness `link_session`, ADR 0011):
# device and inode on Unix, the volume serial and file index on Windows,
# which `std` exposes only on nightly there. It replaces "on Windows every
# existing file is a conflict", which made moving a session back to a
# profile it came from, or retrying a failed move, fail there. Checked
# 2026-11-06 against AGENTS.md section 9: small and mature, no `unsafe` of
# ours, no runtime, and on Windows only `winapi-util` beneath it.
same-file = "1"
# Safe `tcgetwinsize` for the fake-tui test binary (vessel-testkit only).
# The model routing proxy's upstream client (vessel-llm, ADR 0015 decision
# 9): default features off, so no system proxy, no `aws-lc-rs` and no
# platform TLS; `rustls-no-provider` takes the workspace's own rustls config
# (`ring`, the operating system's roots) through `use_preconfigured_tls`.
# HTTP/2 for providers that offer it.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustix = { version = "1", default-features = false, features = ["std", "termios"] }
# TLS for `wss://` relays (vessel-relay; plan decision 1): rustls with the
# `ring` provider chosen explicitly (ADR 0005's amendment: the M1 panic came
# from a provider nobody picked), not rustls's default `aws-lc-rs`, which
# needs CMake and NASM on Windows. TLS 1.2 kept for older reverse proxies.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The operating system's root certificates for those `wss://` relays.
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
# HMAC-SHA256 for relay registration tickets (vessel-relay, protocol 6's
# `fleet.callback`): a fleet's home mints them with the relay's token and
# the relay checks them with it. RustCrypto, the same family as `sha2`.
hmac = "0.13"
# SHA-256 of a vesseld build (vessel-remote): its `-dev-<hash>` name and the
# checksum the remote verifies before installing it (ADR 0008); device
# credential hashes (vessel-store) and invitation keys (vessel-node, ADR
# 0010). RustCrypto, pure Rust, so Windows clients need no system library.
sha2 = "0.11"
# Noise NK for the end-to-end secure channel (vessel-secure, ADR 0009). No
# `std` feature: it would enable `snow`'s optional `ring` (C and assembly).
# Only the primitives of our one suite: ChaCha20-Poly1305, SHA-256, X25519.
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
# Constant-time token comparison (vessel-store, ADR 0005).
subtle = "2.6"
# Temporary data directories in tests.
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "process", "io-util", "sync", "time"] }
# Websocket client (vessel-client). Plain ws only in M1: no TLS stack is
# built until the relay picks one with an explicit crypto provider (ADR 0005).
tokio-tungstenite = "0.29"
tokio-util = "0.7"
# The node book (vessel-client): typed reading through serde and edits that
# keep the user's comments and layout (`vessel nodes add`, pinned ids).
toml_edit = { version = "0.25", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# TypeScript declarations of the wire types for the web UI (vessel-proto's
# and vessel-web's `ts` feature, ADR 0017): derives only, behind a feature
# no shipped binary enables, so nothing on the wire changes. Its own
# `serde-compat` reads our serde attributes; `uuid-impl` and `chrono-impl`
# cover the two foreign types the wire carries (both already in the tree).
# Checked 2026-11-07 against AGENTS.md section 9: a proc macro and a
# small runtime, no `unsafe` of ours, no network or file access outside
# the export functions we do not call.
ts-rs = { version = "12", default-features = false, features = ["serde-compat", "no-serde-warnings", "uuid-impl", "chrono-impl"] }
# NFC for the key under which two file names collide on macOS and Windows
# (vessel-fleet): names differing only in case or Unicode normalisation are
# one file there. The unicode-rs crate (`idna` used it for years); its
# tables and `tinyvec` are all it brings.
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
# LSP file URIs, including platform drive letters and percent encoding (ADR 0016).
url = "2.5"
# Native saved-file change notifications; replaces polling (ADR 0016).
notify = "8"
which = "7"
# Wipes the node's secret key from memory when it is dropped: the key pair
# (vessel-secure) and the bytes read from `node.key` (vessel-store).
zeroize = "1"

# SHA-256 over a `vesseld` build (vessel-remote: its `-dev-<hash>` name)
# runs on every SSH command of a development checkout, and a debug
# `vesseld` is about 150 MB: unoptimised, hashing it took seconds per
# command. Optimising just this crate keeps it well under a second.
[profile.dev.package.sha2]
opt-level = 3

# The secure channel's primitives (vessel-secure) get the same treatment:
# unoptimised, a 16 MiB frame took about 9 s through the channel and 200
# handshakes about 9 s; optimised, under 1 s each. A debug `vessel` or
# `vesseld` talking through a relay would crawl, and so would the tests.
# `snow` and `chacha20poly1305` are listed too: the cipher code is generic,
# so it is compiled where it is instantiated, inside `snow`, at `snow`'s
# level. Optimising only the primitive crates changed little.
[profile.dev.package.snow]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3
