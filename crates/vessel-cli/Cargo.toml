[package]
name = "vessel-cli"
description = "Vessel command-line client: run, attach to and inspect harness sessions on a node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vessel"
path = "src/main.rs"

[dependencies]
vessel-client.workspace = true
vessel-node.workspace = true
vessel-proto.workspace = true
vessel-remote.workspace = true

bytes.workspace = true
clap.workspace = true
crossterm.workspace = true
dirs.workspace = true
qrcode.workspace = true
# A scratch directory for a release download (`vessel node install`).
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
chrono.workspace = true
tempfile.workspace = true
vessel-harness = { workspace = true, features = ["fakes"] }
# The SSH tests stop any node they started (its lock names its pid).
vessel-store.workspace = true
vessel-testkit.workspace = true

[lints]
workspace = true
