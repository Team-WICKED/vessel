[package]
name = "vessel-cli"
description = "Vessel command-line client: run, attach to and inspect harness sessions on a node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "vessel"
path = "src/main.rs"

[dependencies]
vessel-client.workspace = true
# `vessel init`: harness discovery, install and login commands, other
# accounts' homes (plan F5).
vessel-harness.workspace = true
vessel-mcp.workspace = true
vessel-node.workspace = true
vessel-proto.workspace = true
vessel-remote.workspace = true
# `vessel ui` (ADR 0017).
vessel-web.workspace = true

bytes.workspace = true
# The pairing link's expiry (`vessel nodes add --pair`); already in the
# workspace.
chrono.workspace = true
clap.workspace = true
crossterm.workspace = true
dirs.workspace = true
# The name a paired device gives itself (`vessel nodes add --pair`); as
# vesseld names its node.
hostname.workspace = true
qrcode.workspace = true
# A scratch directory for a release download (`vessel node install`).
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std"] }
# Stopping `vessel ui`'s server; already in the workspace.
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# `vessel mcp` speaks JSON-RPC lines; its test reads them.
serde_json.workspace = true
tempfile.workspace = true
# An in-process relay for `vessel nodes add --pair` end to end.
vessel-relay.workspace = true
vessel-harness = { workspace = true, features = ["fakes"] }
# The SSH tests stop any node they started (its lock names its pid).
vessel-store.workspace = true
vessel-testkit.workspace = true

[lints]
workspace = true
