[package]
name = "vessel-lsp"
description = "Bounded read-only language-server context for Vessel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
vessel-proc.workspace = true
vessel-proto.workspace = true
chrono.workspace = true
url.workspace = true
notify.workspace = true
toml_edit.workspace = true
tokio-util.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
which.workspace = true

# Non-blocking opens for saved sources (a FIFO must not park a worker).
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
vessel-testkit.workspace = true

[lints]
workspace = true
