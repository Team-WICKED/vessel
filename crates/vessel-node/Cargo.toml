[package]
name = "vessel-node"
description = "Vessel node daemon (vesseld): runs agent harness sessions on one machine and serves them over protocol 2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vesseld"
path = "src/main.rs"

[dependencies]
vessel-harness.workspace = true
vessel-proto.workspace = true
vessel-relay.workspace = true
vessel-rpc.workspace = true
vessel-secure.workspace = true
vessel-session.workspace = true
vessel-store.workspace = true

axum.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
futures-util = { workspace = true, features = ["sink"] }
# Device credentials and invitation secrets (ADR 0010); already in the
# workspace through vessel-store.
getrandom.workspace = true
hostname.workspace = true
serde_json.workspace = true
# Invitations are kept by the hash of their secret (ADR 0010).
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
vessel-client.workspace = true
vessel-harness = { workspace = true, features = ["fakes"] }
vessel-testkit.workspace = true

[lints]
workspace = true
