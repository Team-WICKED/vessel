[package]
name = "vessel-testkit"
description = "Fake harness binaries (fake-tui, fake-acp, fake-ssh) for Vessel's process-level tests; never shipped"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "fake-tui"
path = "src/bin/fake_tui.rs"

[[bin]]
name = "fake-acp"
path = "src/bin/fake_acp.rs"

[[bin]]
name = "fake-ssh"
path = "src/bin/fake_ssh.rs"

[dependencies]
agent-client-protocol.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "rt"] }
tokio-util = { workspace = true, features = ["compat"] }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lints]
workspace = true
