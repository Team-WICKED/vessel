[package]
name = "vessel-testkit"
description = "Fake harness binaries (fake-tui, fake-acp, fake-ssh, fake-tool) for Vessel's process-level tests; never shipped"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "fake-tui"
path = "src/bin/fake_tui.rs"

[[bin]]
name = "fake-acp"
path = "src/bin/fake_acp.rs"

[[bin]]
name = "fake-ssh"
path = "src/bin/fake_ssh.rs"

[[bin]]
name = "fake-tool"
path = "src/bin/fake_tool.rs"

[features]
# The misbehaving relay (`relay` module): a websocket proxy, so only tests
# that need it pay for the websocket stack (the fake binaries do not).
relay = ["dep:futures-util", "dep:tokio-tungstenite"]

[dependencies]
agent-client-protocol.workspace = true
futures-util = { workspace = true, optional = true, features = ["sink"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "rt"] }
tokio-tungstenite = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["compat"] }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lints]
workspace = true
