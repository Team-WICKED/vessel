[package]
name = "vessel-testkit"
description = "Fake harness binaries (fake-tui, fake-acp, fake-ssh, fake-tool) for Vessel's process-level tests; never shipped"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "fake-tui"
path = "src/bin/fake_tui.rs"

[[bin]]
name = "fake-acp"
path = "src/bin/fake_acp.rs"

[[bin]]
name = "fake-ssh"
path = "src/bin/fake_ssh.rs"

[[bin]]
name = "fake-tool"
path = "src/bin/fake_tool.rs"

[[bin]]
name = "fake-provider"
path = "src/bin/fake_provider.rs"

[[bin]]
name = "fake-lsp"
path = "src/bin/fake_lsp.rs"

[features]
# The misbehaving relay (`relay` module): a websocket proxy, so only tests
# that need it pay for the websocket stack (the fake binaries do not).
relay = ["dep:futures-util", "dep:tokio-tungstenite"]
# The fake model provider (`upstream` module, milestone 5): an HTTP server,
# so only the tests that call a provider pay for it.
upstream = ["dep:axum", "dep:futures-util", "tokio/net", "tokio/time"]

[dependencies]
agent-client-protocol.workspace = true
axum = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true, features = ["sink"] }
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "rt"] }
tokio-tungstenite = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["compat"] }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lints]
workspace = true
