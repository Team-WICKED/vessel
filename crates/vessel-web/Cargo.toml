[package]
name = "vessel-web"
description = "Vessel's web UI: the local server `vessel ui` runs, its embedded single-page app, and the bridge to the book's nodes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
# TypeScript declarations of the bridge's frames (ADR 0017), beside
# vessel-proto's; only the declaration check enables it.
ts = ["dep:ts-rs", "vessel-proto/ts"]

[dependencies]
vessel-client.workspace = true
vessel-proto.workspace = true

axum.workspace = true
futures-util.workspace = true
# The per-launch token (ADR 0017); already in the workspace.
getrandom.workspace = true
hmac.workspace = true
sha2.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tower.workspace = true
tokio-tungstenite.workspace = true
# Pairing links as QR codes for the devices screen, drawn here as SVG (ADR
# 0017, decision 9); the CLI's crate, with its dependency-free `svg`
# renderer.
qrcode = { workspace = true, features = ["svg"] }
serde.workspace = true
serde_json.workspace = true
# Comparing the token in constant time; already in the workspace (the
# relay's token check).
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
ts-rs = { workspace = true, optional = true }

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
# The bridge's tests: real nodes in this process, with the fake harnesses.
bytes.workspace = true
tempfile.workspace = true
vessel-harness = { workspace = true, features = ["fakes"] }
vessel-node.workspace = true
vessel-testkit.workspace = true

[lints]
workspace = true
