  <body>
    <main>
      <h1>The web UI was not built into this binary</h1>
      <p>
        This <code>vessel</code> was built without the web bundle. Build it,
        then build <code>vessel</code> again:
      </p>
      <pre><code>cd web
npm ci
npm run build
cd ..
cargo build -p vessel-cli</code></pre>
      <p>Releases of <code>vessel</code> always include it.</p>
    </main>
  </body>
